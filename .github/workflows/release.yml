name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eska-explorer-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    if: github.repository == '1c-tooling/eska-vscode-explorer' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install Bun and Knope
        run: bash scripts/install-tools.sh release
      - name: Validate before publishing
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --bun check
          bun run --bun compile
          mkdir -p ../eska-playground
          export ESKA_TEST_ROOT="$(realpath ../eska-playground)"
          node scripts/prepare-backends.mjs
      - name: Проверки с установленными бэкендами
        run: |
          bun test
          knope --validate
          KNOPE_TEST_BINARY="$(command -v knope)" \
            python3 -m unittest discover -s test -p '*_test.py'
      - name: Проверка VSIX и LSP в чистом редакторе
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libasound2t64
          bash scripts/install-editor.sh
          bun run --bun package
      - name: Запуск установленного VSIX
        env:
          ESKA_HOST_SUPPORT_DISABLED: '1'
        run: |
          export ESKA_TEST_VSIX="$(realpath "eska-explorer-$(node -p 'require("./package.json").version').vsix")"
          timeout 180s xvfb-run -a node test/run-host.mjs test/language-host.cjs
      - name: Publish the prepared version
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 scripts/release-version.py)"
          if [[ -z "$version" ]]; then
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            # An existing tag must have a published release; API failures are not ignored.
            test "$(gh release view "v$version" --json isDraft --jq .isDraft)" = false
          else
            knope release
            git fetch origin --tags
          fi
          python3 scripts/release-vsix.py "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Prepare the next release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py

  openvsx:
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-stores.yml
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      version: ${{ needs.release.outputs.version }}
      authentication: token
      dry_run: false
