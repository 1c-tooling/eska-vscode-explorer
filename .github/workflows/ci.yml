name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Bun and Knope
        run: bash scripts/install-tools.sh release
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check and compile
        run: |
          bun run --bun check
          bun run --bun compile
      - name: Test client and release preparation
        run: |
          bun test
          mkdir -p ../eska-playground
          ESKA_TEST_ROOT="$(realpath ../eska-playground)" \
          KNOPE_TEST_BINARY="$(command -v knope)" \
            python3 -m unittest discover -s test -p '*_test.py'
