[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"
extra_changelog_sections = [
    { types = ["major"], name = "Несовместимые изменения" },
    { types = ["minor"], name = "Добавлено" },
    { types = ["patch"], name = "Исправлено" },
    { footers = ["Changelog-Note"], name = "Примечания" },
]

[github]
owner = "1c-tooling"
repo = "eska-vscode-explorer"

[[workflows]]
name = "prepare-release"
help_text = "Обновить версию и changelog по Conventional Commits без публикации"

[[workflows.steps]]
type = "PrepareRelease"
allow_empty = true

[[workflows]]
name = "release"
help_text = "Опубликовать уже подготовленную версию и changelog в GitHub Release"

[[workflows.steps]]
type = "Release"
